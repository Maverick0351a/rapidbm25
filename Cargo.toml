[package]
name = "rapidbm25"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Rust-native BM25 (Okapi, L, Plus) with a rank_bm25-compatible Python API"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/Maverick0351a/rapidbm25"
keywords = ["bm25", "search", "retrieval", "ranking", "rag"]
categories = ["text-processing", "algorithms"]
# Ships as a Python package only (PyPI); not published to crates.io.
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
numpy = "0.30"
rustc-hash = "2"
# Batch scoring. MIT OR Apache-2.0.
rayon = "1.10"
# Memory-mapped static indexes. MIT OR Apache-2.0.
memmap2 = "0.9"
# Versioned index header. MIT OR Apache-2.0.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Unicode word boundaries (UAX #29). MIT OR Apache-2.0.
unicode-segmentation = "1.12"
# Snowball stemmers. MIT OR BSD-3-Clause.
rust-stemmers = "1.2"

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW for save(). MIT OR Apache-2.0.
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
